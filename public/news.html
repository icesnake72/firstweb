<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script src="js/theme.js"></script>
  <title>뉴스 · 개발자 포트폴리오</title>
  <meta name="description" content="AI·개발·IT 분야의 최신 뉴스 모음">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Noto+Sans+KR:wght@300..800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .news-head { padding: var(--space-l) 0 var(--space-m); }
    .news-head h1 {
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.25;
      font-weight: var(--font-bold);
      letter-spacing: -0.02em;
    }
    .news-head p {
      margin-top: var(--space-xs);
      color: var(--muted);
      font-size: var(--text-size-medium);
      line-height: 180%;
    }

    /* 주제 탭: 좁은 화면에서는 가로 스크롤 */
    .news-tabs {
      display: flex;
      gap: var(--space-xs);
      margin-bottom: var(--space-m);
      padding-bottom: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .news-tabs::-webkit-scrollbar { display: none; }
    .news-tab {
      flex: none;
      height: 40px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-weight: var(--font-medium);
      white-space: nowrap;
      cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
    }
    .news-tab[aria-pressed="true"] {
      border-color: var(--text);
      background: var(--text);
      color: var(--bg);
    }
    .news-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (hover: hover) {
      .news-tab[aria-pressed="false"]:hover { border-color: var(--text); }
    }

    /* 카드 그리드: 폭에 따라 1~3열 */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
      gap: var(--space-s);
      list-style: none;
      padding-bottom: var(--space-xl);
    }
    .news-item { display: flex; min-width: 0; }
    .news-card {
      display: flex;
      flex-direction: column;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--rounded-large);
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    a.news-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (hover: hover) {
      a.news-card:hover {
        transform: translateY(-3px);
        border-color: rgba(var(--color-primary-rgb), .35);
        box-shadow: 0 10px 24px rgba(0, 0, 0, .08);
      }
    }
    /* 원본 비율과 상관없이 16:9 로 잘라 카드 높이를 맞춘다 */
    .news-thumb {
      position: relative;
      flex: none;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--chip);
    }
    .news-thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .news-thumb--empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 32px;
    }
    .news-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
    }
    .news-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .news-source { color: var(--accent); font-weight: var(--font-medium); }
    .news-source + time::before { content: "·"; margin-right: 8px; }
    .news-title {
      font-size: 16px;
      font-weight: var(--font-bold);
      line-height: 1.5;
    }
    .news-desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }
    .news-title, .news-desc {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      overflow: hidden;
    }

    /* 불러오는 중 */
    .skeleton-line {
      display: block;
      height: 14px;
      border-radius: var(--rounded-small);
      background: var(--chip);
    }
    .skeleton-line--short { width: 40%; }
    .news-card--skeleton { animation: news-pulse 1.4s ease-in-out infinite; }
    @keyframes news-pulse {
      50% { opacity: .5; }
    }
    @media (prefers-reduced-motion: reduce) {
      .news-card--skeleton { animation: none; }
    }

    /* 오류 · 빈 결과 안내 */
    .news-status {
      padding: var(--space-xl) 0;
      color: var(--muted);
      text-align: center;
    }
    .news-status[hidden] { display: none; }
    .news-retry {
      margin-top: var(--space-s);
      min-height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: var(--rounded-normal);
      background: var(--text);
      color: var(--bg);
      font: inherit;
      font-weight: var(--font-medium);
      cursor: pointer;
    }
    .news-retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    footer a { color: inherit; }
  </style>
</head>
<body>

  <nav>
    <div class="wrap wrap--wide">
      <a class="logo" href="index.html" aria-label="홈으로">~/dev</a>
      <div class="nav-right">
        <ul id="nav-menu">
          <li><a href="index.html#experience">경력</a></li>
          <li><a href="index.html#skills">기술</a></li>
          <li><a href="index.html#education">학력</a></li>
          <li><a href="index.html#contact">연락</a></li>
          <li><a href="news.html" aria-current="page">뉴스</a></li>
        </ul>

        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="다크 모드로 전환" aria-pressed="false">
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
          <i class="fa-solid fa-sun" aria-hidden="true"></i>
        </button>

        <!-- 카카오 로그인: 로그인 상태는 /api/me 로 확인해 아래 둘 중 하나를 보여줌 -->
        <div class="auth" id="auth">
          <a class="kakao-btn" id="auth-login" href="/auth/kakao/login" aria-label="카카오 로그인">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.48 3 2 6.58 2 11c0 2.83 1.86 5.32 4.66 6.74l-.95 3.48c-.08.3.26.54.52.37l4.13-2.74c.54.06 1.08.09 1.64.09 5.52 0 10-3.58 10-8S17.52 3 12 3z"/></svg>
            <span class="kakao-label">카카오 로그인</span>
          </a>
          <form class="auth-user" id="auth-user" method="post" action="/auth/kakao/logout" hidden>
            <img class="avatar" id="auth-avatar" src="data:," alt="" width="28" height="28">
            <span class="nickname" id="auth-name"></span>
            <button type="submit" class="logout-btn">로그아웃</button>
          </form>
        </div>

        <button type="button" class="nav-toggle" id="nav-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="nav-menu">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <main class="wrap wrap--wide">
    <header class="news-head">
      <h1>뉴스</h1>
      <p>AI·개발·IT 분야의 최신 소식을 모았습니다.</p>
    </header>

    <div class="news-tabs" role="group" aria-label="뉴스 주제">
      <button type="button" class="news-tab" data-topic="ai" aria-pressed="true">AI</button>
      <button type="button" class="news-tab" data-topic="dev" aria-pressed="false">개발</button>
      <button type="button" class="news-tab" data-topic="tech" aria-pressed="false">IT·기술</button>
      <button type="button" class="news-tab" data-topic="economy" aria-pressed="false">경제</button>
      <button type="button" class="news-tab" data-topic="world" aria-pressed="false">해외 헤드라인</button>
    </div>

    <ul class="news-grid" id="news-grid" aria-label="뉴스 목록"></ul>
    <div class="news-status" id="news-status" role="status" aria-live="polite" hidden></div>
    <noscript><p class="news-status">뉴스를 보려면 JavaScript를 켜 주세요.</p></noscript>
  </main>

  <footer>
    <div class="wrap wrap--wide">© 2026 · 뉴스 제공 <a href="https://newsapi.org" target="_blank" rel="noopener noreferrer">NewsAPI.org</a></div>
  </footer>

  <script src="js/auth.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/news.js" defer></script>
</body>
</html>
