<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F8F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>뉴스 · 개발자 포트폴리오</title>
  <meta name="description" content="카테고리별 최신 헤드라인 뉴스">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Noto+Sans+KR:wght@300..800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* 뉴스 페이지 전용: 카드 그리드는 본문보다 넓게 */
    .wrap--wide { max-width: 1120px; }

    .news-head { padding: 56px 0 24px; }
    .news-head .eyebrow {
      color: var(--accent);
      font-size: var(--text-size-primary);
      font-weight: var(--font-medium);
      margin-bottom: 8px;
    }
    .news-head h1 {
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.25;
      font-weight: var(--font-bold);
      letter-spacing: -0.02em;
    }
    .news-head p { color: var(--muted); margin-top: 8px; }

    /* 툴바: 카테고리 + 검색 */
    .toolbar {
      position: sticky;
      top: 56px;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1 1 auto;
      min-width: 0;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: none;
      height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: var(--rounded-normal);
      background: var(--chip);
      color: var(--text);
      font: inherit;
      font-size: var(--text-size-primary);
      font-weight: var(--font-normal);
      cursor: pointer;
      transition: background .2s;
    }
    .tab[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: var(--font-medium); }
    .tab:focus-visible, .search input:focus-visible, .search button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (hover: hover) { .tab:not([aria-pressed="true"]):hover { background: var(--line); } }

    .search { display: flex; gap: 6px; flex: 0 1 300px; }
    .search input {
      flex: 1;
      min-width: 0;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--rounded-normal);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 16px; /* iOS 입력 시 자동 확대 방지 */
    }
    .search button {
      height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: var(--rounded-normal);
      background: var(--text);
      color: var(--bg);
      font: inherit;
      font-size: var(--text-size-primary);
      font-weight: var(--font-medium);
      cursor: pointer;
    }

    .status { min-height: 24px; margin: 16px 0 8px; color: var(--muted); font-size: 13px; }

    /* 카드 그리드 */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      padding-bottom: 56px;
    }
    .news-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--rounded-large);
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
    }
    .news-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (hover: hover) {
      .news-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0, 0, 0, .08); }
    }
    .news-thumb {
      aspect-ratio: 16 / 9;
      background: var(--chip);
      overflow: hidden;
    }
    .news-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .news-thumb.no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      background: linear-gradient(135deg, var(--color-jobs-3), var(--color-inspire-3));
    }
    .news-body { display: flex; flex-direction: column; gap: 8px; padding: 16px; flex: 1; }
    .news-meta { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .news-source {
      max-width: 60%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: var(--font-medium);
      color: var(--accent);
    }
    .news-title {
      margin: 0;
      color: var(--text);
      text-transform: none;
      letter-spacing: normal;
      font-size: 16px;
      font-weight: var(--font-bold);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 로딩 스켈레톤 */
    .skeleton .news-thumb, .skeleton .bar {
      background: linear-gradient(90deg, var(--chip) 25%, var(--line) 50%, var(--chip) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    .skeleton .bar { height: 12px; border-radius: 4px; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .skeleton .news-thumb, .skeleton .bar { animation: none; } }

    .empty {
      grid-column: 1 / -1;
      padding: 48px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--rounded-large);
    }
    .attribution { padding: 0 0 40px; color: var(--muted); font-size: 12px; }
    .attribution a { color: inherit; }

    @media (max-width: 600px) {
      .news-head { padding: 32px 0 16px; }
      .toolbar { gap: 8px; }
      .search { flex: 1 1 100%; }
      .news-grid { grid-template-columns: 1fr; gap: 12px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="wrap wrap--wide">
      <a class="logo" href="index.html" style="color:inherit;text-decoration:none">~/dev</a>
      <div class="nav-right">
        <ul>
          <li><a href="index.html">홈</a></li>
          <li><a href="news.html" aria-current="page">뉴스</a></li>
          <li><a href="weather.html">날씨</a></li>
          <li><a href="chat.html">챗봇</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="wrap wrap--wide">
    <header class="news-head">
      <p class="eyebrow">Today's headlines</p>
      <h1>오늘의 뉴스</h1>
      <p>NewsAPI에서 가져온 미국 주요 헤드라인입니다. 영어 키워드로 검색할 수도 있어요.</p>
    </header>

    <div class="toolbar">
      <div class="tabs" role="group" aria-label="뉴스 카테고리" id="tabs">
        <button class="tab" data-category="general" aria-pressed="true">전체</button>
        <button class="tab" data-category="technology" aria-pressed="false">기술</button>
        <button class="tab" data-category="business" aria-pressed="false">비즈니스</button>
        <button class="tab" data-category="science" aria-pressed="false">과학</button>
        <button class="tab" data-category="health" aria-pressed="false">건강</button>
        <button class="tab" data-category="sports" aria-pressed="false">스포츠</button>
        <button class="tab" data-category="entertainment" aria-pressed="false">엔터테인먼트</button>
      </div>
      <form class="search" id="search" role="search">
        <input type="search" name="q" placeholder="영어로 검색 (예: AI)" aria-label="뉴스 검색" maxlength="100" autocomplete="off">
        <button type="submit">검색</button>
      </form>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="news-grid" id="grid" role="region" aria-label="뉴스 목록" aria-busy="true"></div>

    <p class="attribution">Powered by <a href="https://newsapi.org" target="_blank" rel="noopener noreferrer">NewsAPI.org</a></p>
  </main>

  <script>
    (function () {
      var grid = document.getElementById("grid");
      var statusEl = document.getElementById("status");
      var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
      var form = document.getElementById("search");
      var input = form.elements.q;
      var LABELS = { general: "전체", technology: "기술", business: "비즈니스", science: "과학", health: "건강", sports: "스포츠", entertainment: "엔터테인먼트" };
      var ERRORS = {
        rateLimited: "오늘 뉴스 조회 한도(무료 플랜 하루 100회)를 다 썼어요. 내일 다시 시도해 주세요.",
        apiKeyInvalid: "NewsAPI 키가 올바르지 않습니다. 환경 변수를 확인해 주세요.",
        apiKeyMissing: "NewsAPI 키가 설정되지 않았습니다.",
        corsNotAllowed: "NewsAPI 무료 플랜은 이 환경에서의 호출을 허용하지 않습니다."
      };
      var current = 0; // 늦게 도착한 이전 요청 무시용

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      }

      function timeAgo(iso) {
        if (!iso) return "";
        var diff = (Date.now() - new Date(iso).getTime()) / 1000;
        if (diff < 60) return "방금 전";
        if (diff < 3600) return Math.floor(diff / 60) + "분 전";
        if (diff < 86400) return Math.floor(diff / 3600) + "시간 전";
        if (diff < 86400 * 7) return Math.floor(diff / 86400) + "일 전";
        return new Date(iso).toLocaleDateString("ko-KR");
      }

      function skeletons(n) {
        grid.replaceChildren();
        for (var i = 0; i < n; i++) {
          var card = el("div", "news-card skeleton");
          card.setAttribute("aria-hidden", "true");
          card.appendChild(el("div", "news-thumb"));
          var body = el("div", "news-body");
          ["40%", "95%", "80%", "60%"].forEach(function (w) { var b = el("div", "bar"); b.style.width = w; body.appendChild(b); });
          card.appendChild(body);
          grid.appendChild(card);
        }
      }

      function card(a) {
        var link = el("a", "news-card");
        link.href = a.url;                    // 서버에서 http(s) 주소만 통과시킴
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        var thumb = el("div", "news-thumb");
        if (a.image) {
          var img = document.createElement("img");
          img.src = a.image;
          img.alt = "";
          img.loading = "lazy";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          img.onerror = function () { thumb.replaceChildren(); thumb.classList.add("no-image"); thumb.textContent = a.source || "News"; };
          thumb.appendChild(img);
        } else {
          thumb.classList.add("no-image");
          thumb.textContent = a.source || "News";
        }
        link.appendChild(thumb);

        var body = el("div", "news-body");
        var meta = el("div", "news-meta");
        if (a.source) meta.appendChild(el("span", "news-source", a.source));
        var when = timeAgo(a.publishedAt);
        if (when) { if (a.source) meta.appendChild(el("span", "", "·")); var t = el("time", "", when); t.dateTime = a.publishedAt; meta.appendChild(t); }
        body.appendChild(meta);
        body.appendChild(el("h2", "news-title", a.title));
        if (a.description) body.appendChild(el("p", "news-desc", a.description));
        link.appendChild(body);
        return link;
      }

      function setTabs(category) {
        tabs.forEach(function (t) { t.setAttribute("aria-pressed", String(t.dataset.category === category)); });
      }

      function load(opts) {
        var id = ++current;
        var qs = opts.q ? "q=" + encodeURIComponent(opts.q) : "category=" + opts.category;
        statusEl.textContent = "불러오는 중…";
        grid.setAttribute("aria-busy", "true");
        skeletons(6);

        // 주소에 상태 저장 (새로고침·공유해도 같은 화면)
        history.replaceState(null, "", "?" + qs);

        fetch("/api/news?" + qs)
          .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
          .then(function (data) {
            if (id !== current) return;
            grid.replaceChildren();
            grid.setAttribute("aria-busy", "false");
            if (!data.ok) {
              statusEl.textContent = "";
              grid.appendChild(el("p", "empty", ERRORS[data.code] || "뉴스를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요."));
              return;
            }
            if (!data.articles.length) {
              statusEl.textContent = "";
              grid.appendChild(el("p", "empty", opts.q ? "'" + opts.q + "' 검색 결과가 없습니다." : "표시할 뉴스가 없습니다."));
              return;
            }
            statusEl.textContent = (opts.q ? "'" + opts.q + "' 검색 결과 " : LABELS[opts.category] + " 헤드라인 ") + data.articles.length + "건";
            var frag = document.createDocumentFragment();
            data.articles.forEach(function (a) { frag.appendChild(card(a)); });
            grid.appendChild(frag);
          })
          .catch(function () {
            if (id !== current) return;
            grid.replaceChildren();
            grid.setAttribute("aria-busy", "false");
            statusEl.textContent = "";
            var msg = location.protocol === "file:"
              ? "이 페이지는 서버(netlify dev 또는 배포 사이트)에서 열어야 뉴스를 불러옵니다."
              : "네트워크 오류로 뉴스를 불러오지 못했습니다.";
            grid.appendChild(el("p", "empty", msg));
          });
      }

      tabs.forEach(function (t) {
        t.addEventListener("click", function () {
          input.value = "";
          setTabs(t.dataset.category);
          load({ category: t.dataset.category });
        });
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var q = input.value.trim();
        if (!q) return;
        setTabs(null);
        load({ q: q });
      });

      // 첫 화면: 주소의 ?category= 또는 ?q= 반영
      var p = new URLSearchParams(location.search);
      var q0 = (p.get("q") || "").trim();
      var c0 = LABELS[p.get("category")] ? p.get("category") : "general";
      if (q0) { input.value = q0; setTabs(null); load({ q: q0 }); }
      else { setTabs(c0); load({ category: c0 }); }
    })();
  </script>
</body>
</html>
